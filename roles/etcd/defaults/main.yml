---
# Which inventory group forms the cluster. Node count is derived from this
# group's membership - see README.md. Override with -e etcd_group_name=...
# if your inventory already uses a different group name.
etcd_group_name: etcd

etcd_cluster_name: etcd-cluster
etcd_version: v3.7.1
etcd_download_arch: ""
etcd_download_base_url: "https://github.com/etcd-io/etcd/releases/download"

etcd_client_port: 2379
etcd_peer_port: 2380

etcd_data_dir: /var/lib/etcd
etcd_config_dir: /etc/etcd
etcd_install_dir: /usr/local/bin
etcd_system_user: etcd
etcd_system_group: etcd

etcd_initial_cluster_state: new

etcd_start_wait_timeout: 60
etcd_health_check_retries: 12
etcd_health_check_delay: 5

# TLS is always on - peer and client traffic are both https://, with mutual
# TLS enforced both ways (--peer-client-cert-auth and --client-cert-auth).
# A CA, per-node peer/server certs, and one shared client cert are all
# generated by this role (community.crypto) - nothing is brought in by the
# operator. Generated CA/keys live under etcd_pki_dir on the control node
# (gitignored - see .gitignore) and are deployed to etcd_remote_pki_dir on
# each target host.
etcd_pki_dir: "{{ playbook_dir }}/../pki/{{ etcd_cluster_name }}"
etcd_remote_pki_dir: /etc/etcd/pki
etcd_key_type: RSA
etcd_key_size: 2048
etcd_ca_validity_days: 3650
etcd_cert_validity_days: 825
