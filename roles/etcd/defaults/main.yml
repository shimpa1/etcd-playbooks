---
# Which inventory group forms the cluster. Node count is derived from this
# group's membership - see README.md. Override with -e etcd_group_name=...
# if your inventory already uses a different group name.
etcd_group_name: etcd

etcd_cluster_name: etcd-cluster
etcd_version: v3.7.1
etcd_download_arch: ""
etcd_download_base_url: "https://github.com/etcd-io/etcd/releases/download"

etcd_client_port: 2379
etcd_peer_port: 2380

etcd_data_dir: /var/lib/etcd
etcd_config_dir: /etc/etcd
etcd_install_dir: /usr/local/bin
etcd_system_user: etcd
etcd_system_group: etcd

etcd_initial_cluster_state: new

etcd_start_wait_timeout: 60
etcd_health_check_retries: 12
etcd_health_check_delay: 5
